<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="color-scheme" content="dark">
<meta name="description" content="Estimate the weight of small objects with your phone's vibration motor and accelerometer.">
<title>VibroScale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1014'/%3E%3Crect x='11' y='6' width='10' height='20' rx='2.5' fill='none' stroke='%232fd1b0' stroke-width='2'/%3E%3Cpath d='M7 12v8M4 14v4M25 12v8M28 14v4' stroke='%232fd1b0' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  VibroScale — single-file, dependency-free, offline web app.
  Estimates the weight of small objects from how much a load on the phone
  damps its own vibration motor, as seen by the accelerometer.
  Target: Chrome on Android. Needs a secure context (https://, localhost or file://).
-->
<style>
:root{
  --bg:#0d1014; --surface:#151a21; --surface-2:#1c222b; --well:#0f1318;
  --line:#29303b; --line-2:#363e4b;
  --text:#e9edf3; --muted:#98a2b3; --faint:#5b6574;
  --accent:#2fd1b0; --accent-ink:#03241d; --accent-soft:rgba(47,209,176,.13);
  --warn:#f3b33d; --warn-soft:rgba(243,179,61,.12);
  --err:#ff6b6b; --err-soft:rgba(255,107,107,.12);
  --info:#8ab4ff; --info-soft:rgba(138,180,255,.12);
  --radius:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic",Tahoma,sans-serif;
  min-height:100vh;min-height:100dvh;padding-bottom:calc(90px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;overflow-x:hidden}
h2{font-size:19px;margin:0 0 8px;line-height:1.3}
h3{font-size:16px;margin:14px 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}

/* header */
header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(13,16,20,.94);border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;min-width:0}
.brand svg{width:30px;height:30px;flex:none;color:var(--accent)}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;min-height:44px;min-width:84px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--surface-2);font-weight:650;font-size:16px;cursor:pointer;touch-action:manipulation}

main{max-width:560px;margin:0 auto;padding:14px 12px}
.banners{max-width:560px;margin:0 auto;padding:0 12px}
.banners:not(:empty){padding-top:10px}
.tab{display:none}
.tab.active{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 0 14px}

/* buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 18px;
  border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:650;font-size:17px;
  cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  transition:transform .08s ease,background-color .15s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.huge{width:100%;min-height:88px;font-size:26px;border-radius:22px;font-weight:800}
.btn.wide{width:100%}
.btn.stop{background:var(--err);border-color:transparent;color:#2a0606}
.btn.danger{background:transparent;color:var(--err);border-color:rgba(255,107,107,.45)}
.btn:focus-visible,.pill:focus-visible,.seg button:focus-visible,nav.tabs button:focus-visible,
.chip:focus-visible,.inp:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;align-items:stretch}
.row>*{min-width:0}
.row.wrap{flex-wrap:wrap}
.grow{flex:1 1 0}
.mt{margin-top:12px}

/* calibration chip */
.chip{display:flex;width:100%;align-items:center;gap:10px;text-align:start;min-height:52px;padding:10px 14px;margin:0 0 12px;
  border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation}
.chip.ok{border-color:rgba(47,209,176,.35);color:#bff3e6;background:var(--accent-soft)}
.chip.warn{border-color:rgba(243,179,61,.4);color:#ffdf9e;background:var(--warn-soft)}
.chip::after{content:"\203A";margin-inline-start:auto;font-size:24px;line-height:1;opacity:.7}
[dir=rtl] .chip::after{content:"\2039"}

/* graph */
.graph{display:block;width:100%;height:190px;border-radius:12px;background:var(--well)}
.graph.small{height:150px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:16px;height:4px;border-radius:2px;background:var(--accent)}
.sw.raw{background:rgba(233,237,243,.35);height:2px}
.sw.win{background:rgba(47,209,176,.3);height:10px;width:14px}
.statusline{min-height:26px;margin:10px 2px 6px;font-size:16px;color:var(--muted)}
.statusline.live{color:var(--text);font-weight:600}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:0 0 12px}
.progress .bar{height:100%;width:0;background:var(--accent);transition:width .12s linear}

/* result */
.result{text-align:center;padding:18px 14px}
.res-label{color:var(--muted);font-size:15px;font-weight:650}
.res-row{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 2px;flex-wrap:wrap}
.big{font-size:68px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.unit{font-size:28px;color:var(--muted);font-weight:700}
.pm{font-size:21px;font-weight:700}
.pm-note{font-size:13px;color:var(--muted);margin-top:2px}
.details{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:14px 0 0;text-align:start;font-size:14.5px}
.details dt{color:var(--muted)}
.details dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.footnote{font-size:12.5px;color:var(--muted);text-align:start;margin:10px 0 0}

/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;text-align:start;border-radius:12px;padding:11px 13px;margin:10px 0 0;
  font-size:15px;line-height:1.45;border:1px solid}
.alert::before{content:"!";flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
  font-weight:800;font-size:14px;margin-top:1px}
.alert.warn{background:var(--warn-soft);border-color:rgba(243,179,61,.4);color:#ffdf9e}
.alert.warn::before{background:var(--warn);color:#2b1d00}
.alert.err{background:var(--err-soft);border-color:rgba(255,107,107,.45);color:#ffc9c9}
.alert.err::before{content:"\00D7";background:var(--err);color:#2a0606}
.alert.info{background:var(--info-soft);border-color:rgba(138,180,255,.4);color:#d3e2ff}
.alert.info::before{content:"i";background:var(--info);color:#0b1a33}
.alert.ok{background:var(--accent-soft);border-color:rgba(47,209,176,.4);color:#c4f5e8}
.alert.ok::before{content:"\2713";background:var(--accent);color:var(--accent-ink)}
.banners .alert{margin:0 0 8px}

/* forms */
.lbl{display:block;font-weight:650;margin:12px 0 6px}
.inp{width:100%;min-height:58px;padding:0 16px;border-radius:14px;border:1px solid var(--line-2);background:var(--well);
  font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.inp::placeholder{color:var(--faint)}
.inp:disabled{opacity:.5}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--well);border:1px solid var(--line);
  border-radius:14px;padding:5px}
.seg.stack{grid-auto-flow:row}
.seg button{min-height:48px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-weight:650;font-size:15.5px;
  cursor:pointer;touch-action:manipulation;padding:0 8px}
.seg button[aria-checked="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button:disabled{opacity:.5}
.setting{margin:0 0 16px}
.setting:last-child{margin-bottom:0}
.setting .lbl{margin-top:0}
.hint{font-size:13.5px;color:var(--muted);margin:6px 2px 0}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.switch{position:relative;width:58px;height:34px;flex:none}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .15s}
.switch span::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(24px)}
[dir=rtl] .switch span::after{left:auto;right:4px}
[dir=rtl] .switch input:checked+span::after{transform:translateX(-24px)}
.switch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

/* calibration table */
.caltable{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.caltable th{font-size:12.5px;color:var(--muted);font-weight:650;text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
.caltable td{padding:3px 4px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.caltable tr:last-child td{border-bottom:0}
.caltable td.hi{color:var(--warn);font-weight:700}
.caltable td.act{width:48px;text-align:end}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:transparent;color:var(--muted);
  font-size:22px;line-height:1;cursor:pointer;display:inline-grid;place-items:center;touch-action:manipulation}
.icon-btn:disabled{opacity:.4}
.fit-sum{font-size:15px;margin-top:10px}
.fit-sum p{margin:0 0 6px}
code.eq{direction:ltr;unicode-bidi:isolate;display:inline-block;background:var(--well);border:1px solid var(--line);border-radius:8px;
  padding:4px 8px;font-size:14px;font-family:ui-monospace,"Roboto Mono",monospace;max-width:100%;overflow-wrap:anywhere}
.fit-sum .best{color:var(--accent);font-weight:700}

/* key/value lists */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin:10px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:end;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kv dd.bad{color:var(--err);font-weight:700}
.kv dd.good{color:var(--accent);font-weight:700}

.help ol,.help ul{padding-inline-start:22px;margin:0 0 8px}
.help li{margin:0 0 8px}
.help p:last-child{margin-bottom:0}
.disclaimer{font-size:13.5px;color:var(--muted);line-height:1.5;margin:4px 0 14px;padding:12px 14px;border:1px dashed var(--line-2);border-radius:12px}

/* bottom navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(17,21,27,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
nav.tabs button{min-height:70px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:650;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;cursor:pointer;touch-action:manipulation;padding:6px 4px;line-height:1.2}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;width:44px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.tabs button{position:relative}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){.big{font-size:80px}}
</style>
</head>
<body>
<noscript><p style="padding:16px">This app needs JavaScript. / يحتاج هذا التطبيق إلى جافاسكربت.</p></noscript>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <rect x="11" y="5" width="10" height="22" rx="2.5"/><path d="M7 12v8M3.5 14v4M25 12v8M28.5 14v4"/>
    </svg>
    <span data-i18n="appName">VibroScale</span>
  </div>
  <button id="langBtn" class="pill" type="button"></button>
</header>

<div id="banners" class="banners" aria-live="polite"></div>

<main>
  <!-- ============ MEASURE ============ -->
  <section id="tab-measure" class="tab active" role="tabpanel" aria-labelledby="nav-measure">
    <button id="calChip" class="chip" type="button"></button>
    <div class="card">
      <canvas id="measCanvas" class="graph" aria-hidden="true"></canvas>
      <div class="legend">
        <span><i class="sw raw"></i><b data-i18n="lgRaw" style="font-weight:500"></b></span>
        <span><i class="sw"></i><b data-i18n="lgEnv" style="font-weight:500"></b></span>
        <span><i class="sw win"></i><b data-i18n="lgWin" style="font-weight:500"></b></span>
      </div>
    </div>
    <div id="measStatus" class="statusline" role="status" aria-live="polite"></div>
    <div class="progress" aria-hidden="true"><div id="measBar" class="bar"></div></div>
    <button id="measureBtn" class="btn primary huge" type="button"></button>
    <div id="measMsg"></div>
    <div id="resultCard" class="card result mt" aria-live="polite" hidden>
      <div id="resLabel" class="res-label"></div>
      <div class="res-row"><span id="resValue" class="big" dir="ltr"></span><span id="resUnit" class="unit"></span></div>
      <div id="resPm" class="pm"></div>
      <div id="resPmNote" class="pm-note"></div>
      <div id="resWarnings"></div>
      <dl id="resDetails" class="details"></dl>
      <p id="resFoot" class="footnote" hidden></p>
    </div>
    <p class="disclaimer mt" data-i18n="disclaimer"></p>
  </section>

  <!-- ============ CALIBRATE ============ -->
  <section id="tab-cal" class="tab" role="tabpanel" aria-labelledby="nav-cal">
    <div class="card">
      <h2 data-i18n="calTitle"></h2>
      <p class="muted small" data-i18n="calIntro"></p>
      <label for="calWeight" class="lbl" data-i18n="calWeightLabel"></label>
      <div class="row">
        <input id="calWeight" class="inp grow" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="go" placeholder="0" dir="ltr">
        <button id="calZero" class="btn" type="button" data-i18n="calZero"></button>
      </div>
      <button id="calMeasureBtn" class="btn primary wide mt" type="button"></button>
      <canvas id="calCanvas" class="graph small mt" aria-hidden="true"></canvas>
      <div id="calStatus" class="statusline" role="status" aria-live="polite"></div>
      <div class="progress" aria-hidden="true"><div id="calBar" class="bar"></div></div>
      <div id="calMsg"></div>
    </div>
    <div class="card">
      <h2 data-i18n="calPoints"></h2>
      <div id="calTable"></div>
    </div>
    <div class="card">
      <h2 data-i18n="fitTitle"></h2>
      <canvas id="fitCanvas" class="graph" aria-hidden="true"></canvas>
      <div id="fitSummary" class="fit-sum"></div>
    </div>
    <div class="row">
      <button id="exportBtn" class="btn grow" type="button" data-i18n="exportBtn"></button>
      <button id="importBtn" class="btn grow" type="button" data-i18n="importBtn"></button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
    <button id="resetBtn" class="btn danger wide mt" type="button" data-i18n="resetBtn"></button>
    <div class="card help mt">
      <h2 data-i18n="calHelpTitle"></h2>
      <div data-i18n-html="calHelpHtml"></div>
    </div>
  </section>

  <!-- ============ HELP & SETTINGS ============ -->
  <section id="tab-help" class="tab" role="tabpanel" aria-labelledby="nav-help">
    <div class="card help">
      <h2 data-i18n="helpTitle"></h2>
      <div data-i18n-html="helpHtml"></div>
    </div>
    <div class="card">
      <h2 data-i18n="setTitle"></h2>
      <div class="setting">
        <div class="lbl" id="lblDelay" data-i18n="setDelay"></div>
        <div class="seg" role="radiogroup" aria-labelledby="lblDelay" data-setting="delay"></div>
        <p class="hint" data-i18n="setDelayHint"></p>
      </div>
      <div class="setting">
        <div class="lbl" id="lblDur" data-i18n="setDuration"></div>
        <div class="seg" role="radiogroup" aria-labelledby="lblDur" data-setting="duration"></div>
      </div>
      <div class="setting">
        <div class="lbl" id="lblSrc" data-i18n="setSource"></div>
        <div class="seg stack" role="radiogroup" aria-labelledby="lblSrc" data-setting="source"></div>
        <p class="hint" data-i18n="setHint"></p>
      </div>
      <div class="setting switch-row">
        <label for="setSound" data-i18n="setSound"></label>
        <span class="switch"><input id="setSound" type="checkbox"><span></span></span>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="diagTitle"></h2>
      <p class="muted small" data-i18n="diagIntro"></p>
      <dl id="diagCaps" class="kv"></dl>
      <div class="row mt">
        <button id="diagBtn" class="btn grow" type="button"></button>
        <button id="diagVibBtn" class="btn grow" type="button" data-i18n="diagVib"></button>
      </div>
      <dl id="diagLive" class="kv"></dl>
      <div id="diagMsg"></div>
    </div>
    <div class="card help">
      <h2 data-i18n="howTitle"></h2>
      <div data-i18n-html="howHtml"></div>
    </div>
    <p class="disclaimer" data-i18n="disclaimer"></p>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button id="nav-measure" role="tab" type="button" data-tab="measure" aria-selected="true" aria-controls="tab-measure">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M8 20h8M5 7h14M12 4l-7 3M12 4l7 3M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/></svg>
    <span data-i18n="tabMeasure"></span>
  </button>
  <button id="nav-cal" role="tab" type="button" data-tab="cal" aria-selected="false" aria-controls="tab-cal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
    <span data-i18n="tabCal"></span>
  </button>
  <button id="nav-help" role="tab" type="button" data-tab="help" aria-selected="false" aria-controls="tab-help">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.7.3-1 .9-1 1.6v.4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
    <span data-i18n="tabHelp"></span>
  </button>
</nav>

<script>
(() => {
'use strict';

/* =====================================================================
   Configuration
   ===================================================================== */
const CFG = {
  repeats: 3,            // runs per measurement / per calibration point
  baselineMs: 700,       // record this long before the motor starts (noise floor, gravity)
  trimMs: 300,           // ignore first/last 0.3 s of the vibration (spin-up / spin-down)
  postMs: 450,           // keep recording after the motor stops (detects shifting)
  pauseMs: 900,          // settle time between runs
  hpCutoffHz: 1.0,       // high-pass cut-off; low on purpose (aliased vibration can land at a few Hz)
  stillThresh: 0.12,     // m/s² RMS of filtered |a| that counts as "still"
  stillHoldMs: 600,
  stillTimeoutMs: 8000,
  vibRatioMin: 2.0,      // vibration RMS must exceed background noise by this factor…
  vibAbsMin: 0.02,       // …and this absolute level (m/s²)
  cvWarn: 0.08,          // warn when run-to-run spread exceeds 8 %
  flatMin: 0.97,         // |gz|/|g| below this → not lying flat (~14°)
  shiftMax: 0.3,         // m/s² change of the gravity vector before/after → phone moved
  requestHz: 200,        // ask for the highest rate; browsers cap it (Chrome often at 60 Hz)
  tapMs: 47,             // iPhone mode: interval between haptic taps (not a multiple of the 16.7 ms sample period)
  tapJitterMs: 6,        // …plus random jitter so taps don't phase-lock with the sensor samples
  minWindowSamples: 12,
  fewWindowSamples: 50,

const KEYS = { settings: 'vibroscale.settings.v1', cal: 'vibroscale.calibration.v1', lang: 'vibroscale.lang' };

class AppError extends Error { constructor(code, vars) { super(code); this.code = code; this.vars = vars || {}; } }

function wait(ms, signal) {

    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0))
    .replace(/[٫,]/g, '.')
    .replace(/\s+/g, '')

function sanitizeCal(c) {

  const num = v => (typeof v === 'number' && isFinite(v)) ? v : null;

   ===================================================================== */
// 2nd-order Butterworth high-pass (RBJ cookbook)
function hpCoeffs(fc, fs) {

// Direct form II transposed, state initialised to steady state for x[0] (no start-up transient).
function biquad(x, c) {

function makeLiveHP(fc) {

// Sensor events are not perfectly regular: resample all axes onto a uniform grid.
function resampleUniform(s) {

  const avg = span / (s.length - 1);
  let dt = median(dts);
  if (!(dt > 0)) dt = avg;
  dt = clamp(dt, avg * 0.5, avg * 2);

// In-place iterative radix-2 FFT
function fft(re, im) {

    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let tmp = re[i]; re[i] = re[j]; re[j] = tmp; tmp = im[i]; im[i] = im[j]; im[j] = tmp; }

  const w0 = idx(rec.tVib + CFG.trimMs), w1 = idx(rec.tVib + rec.durMs - CFG.trimMs);
  const b0 = idx(rec.tStart + 250), b1 = idx(rec.tVib - 20);
  const p0 = idx(rec.tVib + rec.durMs + 150), p1 = U.n;
  if (w1 - w0 < CFG.minWindowSamples) throw E('fewSamples', { n: Math.max(0, w1 - w0) });
  const rmsOf = (i0, i1) => { if (i1 - i0 < 3) return NaN; let a = 0; for (let i = i0; i < i1; i++) a += hx[i] * hx[i] + hy[i] * hy[i] + hz[i] * hz[i]; return Math.sqrt(a / (i1 - i0)); };
  const meanVec = (i0, i1) => { if (i1 - i0 < 3) return null; let x = 0, y = 0, z = 0; for (let i = i0; i < i1; i++) { x += U.X[i]; y += U.Y[i]; z += U.Z[i]; } const k = i1 - i0; return [x / k, y / k, z / k]; };
  const rms = rmsOf(w0, w1);
  const base = rmsOf(b0, b1);
  const g = meanVec(b0, b1) || meanVec(0, w0) || [0, 0, 9.81];
  const gPost = meanVec(p0, p1);
  const gNorm = Math.hypot(g[0], g[1], g[2]);
  return {
    rms, base: isFinite(base) ? base : 0, fs: U.fs, nWin: w1 - w0,
    freq: dominantFreq([hx, hy, hz], w0, w1, U.fs),
    g, gNorm, flat: gNorm > 0 ? Math.abs(g[2]) / gNorm : 0, orient: zUp(g[2]) ? 'up' : 'down',
    shift: gPost ? Math.hypot(gPost[0] - g[0], gPost[1] - g[1], gPost[2] - g[2]) : 0,
  };
}

/* =====================================================================
   Calibration curve fitting
   ===================================================================== */
function wls(x, y, v) {
  let S = 0, Sx = 0, Sy = 0, Sxx = 0, Sxy = 0;
  for (let i = 0; i < x.length; i++) { const w = v[i]; S += w; Sx += w * x[i]; Sy += w * y[i]; Sxx += w * x[i] * x[i]; Sxy += w * x[i] * y[i]; }
  const D = S * Sxx - Sx * Sx;
  if (!(Math.abs(D) > 0)) return null;
  return [(Sxx * Sy - Sx * Sxy) / D, (S * Sxy - Sx * Sy) / D];
}
const normW = v => { const m = Math.max(...v); return m > 0 ? v.map(x => x / m) : v; };

/* A = amplitude (m/s²), w = weight (g). Each model has 2 parameters, so R² is a fair comparison.
   Initial values come from weighted linearisations; Levenberg–Marquardt then refines them so
   every model is the least-squares fit in amplitude space. */
const MODELS = {
  linear: {          // A = a + b·w
    init: (w, a) => wls(w, a, a.map(() => 1)),
    f: (x, p) => p[0] + p[1] * x,
    grad: (x) => [1, x],
    dfdx: (x, p) => p[1],
    inv: (A, p) => (A - p[0]) / p[1],
    ok: p => p[1] !== 0,
    eq: p => `A = ${sig(p[0])} ${p[1] < 0 ? '−' : '+'} ${sig(Math.abs(p[1]))}·w`,
  },
  inverse: {         // A = 1 / (p + q·w)   (≈ F / (m_phone + w)·ω², i.e. the 1/x family that stays finite at w = 0)
    init: (w, a) => wls(w, a.map(v => 1 / v), normW(a.map(v => v ** 4))),
    f: (x, p) => 1 / (p[0] + p[1] * x),
    grad: (x, p) => { const f = 1 / (p[0] + p[1] * x); return [-f * f, -x * f * f]; },
    dfdx: (x, p) => { const f = 1 / (p[0] + p[1] * x); return -p[1] * f * f; },
    inv: (A, p) => (1 / A - p[0]) / p[1],
    ok: (p, lo, hi) => p[1] !== 0 && p[0] + p[1] * lo > 0 && p[0] + p[1] * hi > 0,
    eq: p => `A = 1 / (${sig(p[0])} ${p[1] < 0 ? '−' : '+'} ${sig(Math.abs(p[1]))}·w)`,
  },
  exponential: {     // A = c·e^(k·w)
    init: (w, a) => { const r = wls(w, a.map(Math.log), normW(a.map(v => v * v))); return r && [Math.exp(r[0]), r[1]]; },
    f: (x, p) => p[0] * Math.exp(p[1] * x),
    grad: (x, p) => { const e = Math.exp(p[1] * x); return [e, p[0] * x * e]; },
    dfdx: (x, p) => p[0] * p[1] * Math.exp(p[1] * x),
    inv: (A, p) => Math.log(A / p[0]) / p[1],
    ok: p => p[0] > 0 && p[1] !== 0,
    eq: p => `A = ${sig(p[0])}·e^(${sig(p[1])}·w)`,
  },
};

function refineLM(M, xs, ys, p0, lo, hi) {
  let p = p0.slice();
  const sse = q => { let s = 0; for (let i = 0; i < xs.length; i++) { const r = ys[i] - M.f(xs[i], q); s += r * r; } return s; };
  let cur = sse(p), lam = 1e-3;
  for (let it = 0; it < 200; it++) {
    let a11 = 0, a12 = 0, a22 = 0, g1 = 0, g2 = 0;
    for (let i = 0; i < xs.length; i++) {
      const j = M.grad(xs[i], p), r = ys[i] - M.f(xs[i], p);
      a11 += j[0] * j[0]; a12 += j[0] * j[1]; a22 += j[1] * j[1]; g1 += j[0] * r; g2 += j[1] * r;
    }
    let improved = false, rel = 0;
    while (lam < 1e12) {
      const b11 = a11 * (1 + lam), b22 = a22 * (1 + lam), det = b11 * b22 - a12 * a12;
      if (Math.abs(det) > 0) {
        const q = [p[0] + (g1 * b22 - a12 * g2) / det, p[1] + (b11 * g2 - a12 * g1) / det];
        if (q.every(isFinite) && M.ok(q, lo, hi)) {
          const s = sse(q);
          if (isFinite(s) && s < cur) { rel = (cur - s) / (cur || 1); p = q; cur = s; lam = Math.max(lam / 3, 1e-15); improved = true; break; }
        }
      }
      lam *= 4;
    }
    if (!improved || rel < 1e-13) break;
  }
  return p;
}

function fitCalibration(points) {
  const pts = points.filter(p => p.mean > 0 && isFinite(p.w));
  const distinct = new Set(pts.map(p => p.w)).size;
  if (distinct < 3) return { ok: false, reason: 'fitNeed', n: distinct };
  const xs = pts.map(p => p.w), ys = pts.map(p => p.mean), n = pts.length;
  const lo = Math.min(...xs), hi = Math.max(...xs);
  const ym = mean(ys), sst = ys.reduce((s, y) => s + (y - ym) ** 2, 0);
  if (!(sst > 1e-12 * ym * ym)) return { ok: false, reason: 'fitFlat', n: distinct };
  const models = [];
  for (const name of Object.keys(MODELS)) {
    const M = MODELS[name];
    try {
      let p = M.init(xs, ys);
      if (!p || !p.every(isFinite) || !M.ok(p, lo, hi)) continue;
      p = refineLM(M, xs, ys, p, lo, hi);
      const pred = xs.map(x => M.f(x, p));
      if (!pred.every(isFinite)) continue;
      const d1 = M.dfdx(lo, p), d2 = M.dfdx(hi, p);
      if (!(d1 * d2 > 0)) continue;                 // must be monotonic over the range to be invertible
      const sse = ys.reduce((s, y, i) => s + (y - pred[i]) ** 2, 0);
      models.push({ name, p, sse, r2: 1 - sse / sst });
    } catch (_) { /* skip model */ }
  }
  if (!models.length) return { ok: false, reason: 'fitNoModel', n: distinct };
  models.sort((a, b) => b.r2 - a.r2);
  const best = models[0], M = MODELS[best.name], dof = Math.max(1, n - 2);
  const sA = Math.sqrt(best.sse / dof);
  const wRes = pts.map(pt => M.inv(pt.mean, best.p) - pt.w);
  const rmseW = Math.sqrt(wRes.reduce((s, r) => s + r * r, 0) / dof);
  return {
    ok: true, n, distinct, model: best.name, p: best.p, r2: best.r2, sA, rmseW, models,
    wMin: lo, wMax: hi, aMin: Math.min(...ys), aMax: Math.max(...ys), increasing: M.dfdx(lo, best.p) > 0,
  };
}

/* Weight from mean amplitude. ± is ≈95 % (2σ): amplitude uncertainty of a new measurement
   (calibration residual SD or this measurement's own standard error, whichever is larger,
   plus curve uncertainty) propagated through the local slope of the curve. */
function estimateWeight(fit, amp, sem) {
  const M = MODELS[fit.model];
  const tol = Math.max(fit.sA, 0.02 * amp);
  const outOfRange = amp < fit.aMin - tol || amp > fit.aMax + tol;
  const w = M.inv(amp, fit.p);
  if (!isFinite(w)) return { w: null, err: null, outOfRange: true };
  const slope = Math.abs(M.dfdx(w, fit.p));
  const sigA = Math.sqrt(Math.max(fit.sA * fit.sA, sem * sem) + fit.sA * fit.sA / fit.n);
  let err = slope > 0 ? 2 * sigA / slope : null;
  if (err != null && !isFinite(err)) err = null;
  return { w, err, outOfRange };
}

/* =====================================================================
   Sensors
   ===================================================================== */
const hub = {
  kind: null, active: false, listeners: new Set(), lastArrival: 0, _stop: null,
  on(fn) { this.listeners.add(fn); },
  off(fn) { this.listeners.delete(fn); },
  emit(t, x, y, z) {
    this.lastArrival = performance.now();
    for (const fn of this.listeners) { try { fn(t, x, y, z); } catch (e) { console.error(e); } }
  },
  async start(pref) {
    if (this.active && (pref === 'auto' || pref === this.kind)) return this.kind;
    this.stop();
    const order = pref === 'generic' ? ['generic'] : pref === 'devicemotion' ? ['devicemotion'] : ['generic', 'devicemotion'];
    const errs = [];
    for (const k of order) {
      if (k === 'generic' && !('Accelerometer' in window)) { errs.push(E('noSensor')); continue; }
      if (k === 'devicemotion' && !('DeviceMotionEvent' in window)) { errs.push(E('noSensor')); continue; }
      try {
        await (k === 'generic' ? this._generic() : this._deviceMotion());
        this.kind = k; this.active = true; this.lastArrival = performance.now();
        return k;
      } catch (e) { errs.push(toAppError(e)); }
    }
    // Report the most useful reason
    throw errs.find(e => e.code === 'permDenied') || errs.find(e => e.code === 'noData') || errs.find(e => e.code !== 'noSensor') || errs[0] || E('noSensor');
  },
  stop() {
    if (this._stop) { try { this._stop(); } catch (_) {} }
    this._stop = null; this.active = false; this.kind = null;
  },
  // Sensor timestamps should share performance.now()'s time base; if not, re-base them on arrival time.
  _timeFix() {
    let offset = null;
    return ts => {
      const now = performance.now();
      if (!(ts > 0)) ts = now;
      if (offset === null || Math.abs(ts + offset - now) > 1000) offset = Math.abs(now - ts) > 300 ? now - ts : 0;
      return ts + offset;
    };
  },
  async _generic() {
    if (navigator.permissions && navigator.permissions.query) {
      try { const st = await navigator.permissions.query({ name: 'accelerometer' }); if (st.state === 'denied') throw E('permDenied'); }
      catch (e) { if (e instanceof AppError) throw e; }
    }
    let sensor;
    try { sensor = new Accelerometer({ frequency: CFG.requestHz, referenceFrame: 'device' }); }
    catch (e) {
      if (e && e.name === 'SecurityError') throw E('permDenied');
      try { sensor = new Accelerometer({ frequency: 60 }); }
      catch (e2) { throw E(e2 && e2.name === 'SecurityError' ? 'permDenied' : 'sensorErr', { msg: (e2 && e2.message) || String(e2) }); }
    }
    const fix = this._timeFix();
    return new Promise((resolve, reject) => {
      let settled = false;
      const cleanup = () => {
        sensor.removeEventListener('reading', onReading);
        sensor.removeEventListener('error', onError);
        try { sensor.stop(); } catch (_) {}
      };
      const timer = setTimeout(() => { if (!settled) { settled = true; cleanup(); reject(E('noData')); } }, 3000);
      const onReading = () => {
        if (sensor.x == null) return;
        const t = fix(sensor.timestamp);
        if (!settled) { settled = true; clearTimeout(timer); this._stop = cleanup; resolve(); }
        this.emit(t, sensor.x, sensor.y, sensor.z);
      };
      const onError = ev => {
        const er = ev && ev.error;
        const code = er && (er.name === 'NotAllowedError' || er.name === 'SecurityError') ? 'permDenied' : er && er.name === 'NotReadableError' ? 'noData' : 'sensorErr';
        const ae = E(code, { msg: er ? `${er.name}: ${er.message}` : '?' });
        if (!settled) { settled = true; clearTimeout(timer); cleanup(); reject(ae); }
        else console.warn('Sensor error', ae);
      };
      sensor.addEventListener('reading', onReading);
      sensor.addEventListener('error', onError);
      try { sensor.start(); }
      catch (e) { settled = true; clearTimeout(timer); cleanup(); reject(E('sensorErr', { msg: (e && e.message) || String(e) })); }
    });
  },
  async _deviceMotion() {
    // iOS Safari and recent Chrome versions expose requestPermission(). Chrome may answer "prompt"
    // even though events flow, so only an explicit "denied" is fatal; otherwise the no-data timeout decides.
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      let r = null;
      try { r = await DeviceMotionEvent.requestPermission(); } catch (_) { r = null; }
      if (r === 'denied') throw E('permDenied');
    }
    const fix = this._timeFix();
    return new Promise((resolve, reject) => {
      let settled = false;
      const h = e => {
        const a = e.accelerationIncludingGravity;   // raw accelerometer (not the fused, smoothed "acceleration")
        if (!a || a.x == null || a.y == null || a.z == null) return;
        const t = fix(e.timeStamp);
        if (!settled) { settled = true; clearTimeout(timer); this._stop = () => window.removeEventListener('devicemotion', h); resolve(); }
        this.emit(t, a.x, a.y, a.z);
      };
      const timer = setTimeout(() => { if (!settled) { settled = true; window.removeEventListener('devicemotion', h); reject(E('noData')); } }, 3000);
      window.addEventListener('devicemotion', h);
    });
  },
};

/* =====================================================================
   Excitation: the vibration motor (Vibration API) or, on iPhone, haptic taps
   ===================================================================== */
function excitationKind() {
  if (typeof navigator.vibrate === 'function') return 'motor';
  if (IS_IOS) return 'taps';
  return null;
}
// iOS 18+ plays a short haptic when a <input type="checkbox" switch> is toggled; a label click toggles it.
function hapticTap() {
  try {
    const label = document.createElement('label');
    label.setAttribute('aria-hidden', 'true');
    label.style.display = 'none';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.setAttribute('switch', '');
    input.tabIndex = -1;
    label.appendChild(input);
    document.body.appendChild(label);
    label.click();
    label.remove();
  } catch (_) { /* ignore */ }
}
const exciter = {
  timer: null,
  start(durMs) {
    const kind = excitationKind();
    if (kind === 'motor') { try { return navigator.vibrate(durMs) !== false; } catch (_) { return false; } }
    if (kind === 'taps') {
      this.stop();
      const end = performance.now() + durMs;
      const step = () => {
        this.timer = null;
        if (performance.now() >= end) return;
        hapticTap();
        this.timer = setTimeout(step, CFG.tapMs + (Math.random() * 2 - 1) * CFG.tapJitterMs);
      };
      step();
      return true;
    }
    return false;
  },
  stop() {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    try { if (typeof navigator.vibrate === 'function') navigator.vibrate(0); } catch (_) { /* ignore */ }
  },
};

function capabilityBlocker() {
  if (!window.isSecureContext) return E('insecure');
  const ek = excitationKind();
  if (!ek) return E('vibUnsupported');
  if (ek === 'taps' && IOS_MAJOR && IOS_MAJOR < 18) return E('iosTooOld', { v: IOS_MAJOR });
  if (!('Accelerometer' in window) && !('DeviceMotionEvent' in window)) return E('noSensor');
  return null;
}

/* Record one run: baseline → vibrate(durMs) → post. Fills `trace` for the live graph. */
function record({ baselineMs, durMs, postMs, signal, trace }) {
  return new Promise((resolve, reject) => {
    const samples = [];
    const hp = makeLiveHP(CFG.hpCutoffHz);
    const tStart = performance.now();
    const timers = [];
    let tVib = 0, finished = false;
    if (trace) { trace.tStart = tStart; trace.total = baselineMs + durMs + postMs; trace.durMs = durMs; trace.pts = []; }
    const onS = (t, x, y, z) => {
      samples.push({ t, x, y, z });
      const m = hp(t, x, y, z);
      if (trace) trace.pts.push([t - tStart, m]);
    };
    const cleanup = () => {
      finished = true; hub.off(onS); timers.forEach(clearTimeout); clearInterval(wd);
      if (signal) signal.removeEventListener('abort', onAbort);
    };
    const fail = e => { if (finished) return; cleanup(); exciter.stop(); reject(e); };
    const onAbort = () => fail(abortErr(signal));
    const wd = setInterval(() => { if (performance.now() - hub.lastArrival > 1500) fail(E('sensorStopped')); }, 300);
    if (signal) { if (signal.aborted) { onAbort(); return; } signal.addEventListener('abort', onAbort); }
    hub.on(onS);
    timers.push(setTimeout(() => {
      if (finished) return;
      tVib = performance.now();
      if (trace) trace.tVib = tVib;
      if (!exciter.start(durMs)) { fail(E('vibBlocked')); return; }
      timers.push(setTimeout(() => {
        if (finished) return;
        cleanup();
        resolve({ samples, tStart, tVib, durMs, tEnd: performance.now() });
      }, durMs + postMs));
    }, baselineMs));
  });
}

/* Resolve true once the filtered acceleration stays quiet for stillHoldMs, false on timeout. */
function waitForStill(signal) {
  return new Promise((resolve, reject) => {
    const hp = makeLiveHP(CFG.hpCutoffHz), t0 = performance.now(), buf = [];
    let sum = 0, stillSince = null, done = false;
    const finish = (v, e) => {
      if (done) return; done = true; hub.off(onS); clearInterval(wd);
      if (signal) signal.removeEventListener('abort', onAbort);
      if (e) reject(e); else resolve(v);
    };
    const onAbort = () => finish(null, abortErr(signal));
    const onS = (t, x, y, z) => {
      const m = hp(t, x, y, z), e = m * m;
      buf.push([t, e]); sum += e;
      while (buf.length > 1 && buf[0][0] < t - 500) sum -= buf.shift()[1];
      const now = performance.now();
      if (now - t0 < 400) return;
      const rms = Math.sqrt(Math.max(0, sum) / buf.length);
      if (rms < CFG.stillThresh) { if (stillSince === null) stillSince = now; if (now - stillSince >= CFG.stillHoldMs) finish(true); }
      else stillSince = null;
      if (now - t0 > CFG.stillTimeoutMs) finish(false);
    };
    const wd = setInterval(() => { if (performance.now() - hub.lastArrival > 1500) finish(null, E('sensorStopped')); }, 300);
    if (signal) { if (signal.aborted) { onAbort(); return; } signal.addEventListener('abort', onAbort); }
    hub.on(onS);
  });
}

/* =====================================================================
   Measurement session (shared by Measure and Calibrate)
   ===================================================================== */
async function startSession(area) {
  if (busy) return;
  errors[area] = null;
  if (area === 'cal') calNote = null;
  renderMessages();
  let weight = null;
  if (area === 'cal') {
    weight = parseWeight($('calWeight').value);
    if (weight === null) { errors.cal = E('badWeight'); renderMessages(); $('calWeight').focus(); return; }
    if (cal.points.some(p => sameW(p.w, weight)) && !confirm(tp('replaceConfirm', { w: fmtW(weight) }))) return;
  }
  const blocker = capabilityBlocker();
  if (blocker) { errors[area] = blocker; renderMessages(); return; }
  stopDiag();
  unlockAudio();
  const ctrl = new AbortController();
  busy = { mode: area, ctrl, phase: 'sensor', runIdx: -1 };
  traces[area] = [];
  setBar(area, 0);
  setBusyUI();
  kick();
  try {
    setStatus(area, 'stSensor');
    const kind = await hub.start(settings.source);
    acquireWakeLock();
    busy.phase = 'countdown';
    for (let s = settings.delay; s > 0; s--) {
      setStatus(area, 'stCountdown', { s });
      beep('tick');
      await wait(1000, ctrl.signal);
    }
    busy.phase = 'still';
    setStatus(area, 'stStill');
    const still = await waitForStill(ctrl.signal);
    const runs = [];
    for (let i = 0; i < CFG.repeats; i++) {
      busy.phase = 'run'; busy.runIdx = i;
      const trace = { pts: [], tStart: performance.now(), tVib: 0, durMs: settings.duration, total: 1, rms: null };
      traces[area].push(trace);
      setStatus(area, 'stRun', { i: i + 1, n: CFG.repeats });
      const rec = await record({ baselineMs: CFG.baselineMs, durMs: settings.duration, postMs: CFG.postMs, signal: ctrl.signal, trace });
      const r = analyzeRun(rec);
      trace.rms = r.rms;
      runs.push(r);
      if (i < CFG.repeats - 1) {
        busy.phase = 'pause';
        setStatus(area, 'stPause', { i: i + 1, n: CFG.repeats });
        await wait(CFG.pauseMs, ctrl.signal);
      }
    }
    busy.phase = 'done';
    const res = summarizeRuns(runs, still, kind);
    if (area === 'measure') finishMeasure(res); else finishCal(res, weight);
    setStatus(area, 'stDone');
    setBar(area, 1);
    beep('done');
  } catch (e) {
    const err = toAppError(e);
    if (err.code === 'cancelled') setStatus(area, 'stCancelled');
    else { setStatus(area, null); errors[area] = err; renderMessages(); beep('error'); }
    setBar(area, 0);
  } finally {
    exciter.stop();
    releaseWakeLock();
    if (!diag) hub.stop();
    busy = null;
    setBusyUI();
    drawAll();
  }
}

function cancelSession() {
  if (!busy) return;
  exciter.stop();
  busy.ctrl.abort(E('cancelled'));
}

function summarizeRuns(runs, still, kind) {
  const warnings = [];
  const used = runs.filter(r => r.rms >= Math.max(CFG.vibAbsMin, CFG.vibRatioMin * r.base));
  if (!used.length) throw E(excitationKind() === 'taps' ? 'noTaps' : 'noVibration');
  if (used.length < runs.length) warnings.push({ k: 'wWeakVib', v: { k: runs.length - used.length } });
  const amps = used.map(r => r.rms);
  const m = mean(amps), s = sd(amps), cv = m > 0 ? s / m : 0;
  if (used.length >= 2 && cv > CFG.cvWarn) warnings.push({ k: 'wSpread', v: { cv: (cv * 100).toFixed(0) } });
  if (!still) warnings.push({ k: 'wNotStill' });
  if (Math.min(...runs.map(r => r.flat)) < CFG.flatMin) warnings.push({ k: 'wNotFlat' });
  if (runs.some(r => r.shift > CFG.shiftMax)) warnings.push({ k: 'wMoved' });
  const fs = mean(runs.map(r => r.fs)), nWin = Math.min(...used.map(r => r.nWin));
  if (nWin < CFG.fewWindowSamples) warnings.push({ k: 'wFewSamples', v: { n: nWin, fs: fs.toFixed(0) } });
  const freqs = used.map(r => r.freq).filter(f => f != null && isFinite(f));
  return {
    runs, used, amps, mean: m, sd: s, cv, sem: used.length > 1 ? s / Math.sqrt(used.length) : 0,
    base: mean(runs.map(r => r.base)), fs, freq: freqs.length ? median(freqs) : null,
    orient: mode(runs.map(r => r.orient)), kind, warnings, nWin, t: Date.now(),
  };
}

function finishMeasure(res) {
  const out = Object.assign({}, res, { est: null, runW: null, warnings: res.warnings.slice() });
  const fit = currentFit;
  if (fit && fit.ok) {
    const M = MODELS[fit.model];
    out.est = estimateWeight(fit, res.mean, res.sem);
    out.runW = res.used.map(r => M.inv(r.rms, fit.p));
    if (out.est.outOfRange) out.warnings.unshift({ k: 'wOutOfRange', v: { range: `${fmtW(fit.wMin)}–${fmtW(fit.wMax)}` } });
    const cm = calMeta();
    if (cm.orient && res.orient && cm.orient !== res.orient) out.warnings.push({ k: 'wOrient', v: { a: '@orient_' + cm.orient, b: '@orient_' + res.orient } });
    if (cm.fs > 0 && Math.abs(res.fs - cm.fs) / cm.fs > 0.2) out.warnings.push({ k: 'wRate', v: { now: res.fs.toFixed(0), cal: cm.fs.toFixed(0) } });
    if (cm.dur && cm.dur !== settings.duration) out.warnings.push({ k: 'wDur', v: { now: settings.duration / 1000, cal: cm.dur / 1000 } });
  } else {
    out.warnings.unshift({ k: 'wNoCal' });
  }
  lastResult = out;
  renderResult();
  drawFit();
}

function finishCal(res, weight) {
  const pt = {
    w: weight, mean: res.mean, amps: res.amps.map(a => +a.toPrecision(6)), sd: res.sd,
    fs: +res.fs.toFixed(2), orient: res.orient, kind: res.kind, dur: settings.duration,
    freq: res.freq != null ? +res.freq.toFixed(2) : null, t: Date.now(),
  };
  cal.points = cal.points.filter(p => !sameW(p.w, weight));
  cal.points.push(pt);
  cal.points.sort((a, b) => a.w - b.w);
  saveCal();
  refit();
  calNote = { kind: 'ok', k: 'calAdded', v: { w: fmtW(weight), a: fmtA(res.mean), cv: (res.cv * 100).toFixed(1) }, warnings: res.warnings };
  $('calWeight').value = '';
  renderCal();
  renderChip();
  renderMessages();
}

function refit() { currentFit = fitCalibration(cal.points); }

let wakeLock = null;
async function acquireWakeLock() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
  catch (_) { wakeLock = null; }
}
function releaseWakeLock() { try { if (wakeLock) wakeLock.release(); } catch (_) {} wakeLock = null; }

let actx = null;
function unlockAudio() {
  if (!settings.sound) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state === 'suspended') actx.resume();
  } catch (_) { actx = null; }
}
// Never called while recording, so the speaker cannot pollute the measurement.
function beep(kind) {
  if (!settings.sound || !actx) return;
  const seq = kind === 'done' ? [[880, 0, 0.12], [1320, 0.16, 0.18]] : kind === 'tick' ? [[660, 0, 0.05]] : [[220, 0, 0.35]];
  try {
    for (const [f, at, d] of seq) {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + at;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + d + 0.03);
    }
  } catch (_) {}
}

/* =====================================================================
   Diagnostics
   ===================================================================== */
async function startDiag() {
  if (busy || diag) return;
  errors.diag = null; renderMessages();
  const blocker = !window.isSecureContext ? E('insecure') : null;
  if (blocker) { errors.diag = blocker; renderMessages(); return; }
  diag = { kind: null, starting: true, times: [], last: null, hp: makeLiveHP(CFG.hpCutoffHz), buf: [], sum: 0, noise: 0, vibBusy: false };
  renderDiag();
  try {
    const kind = await hub.start(settings.source);
    if (!diag) { if (!busy) hub.stop(); return; }
    diag.kind = kind; diag.starting = false;
    diag.onS = (t, x, y, z) => {
      const d = diag; if (!d) return;
      d.times.push(t); while (d.times.length && d.times[0] < t - 1000) d.times.shift();
      d.last = [x, y, z];
      const m = d.hp(t, x, y, z), e = m * m;
      d.buf.push([t, e]); d.sum += e;
      while (d.buf.length > 1 && d.buf[0][0] < t - 500) d.sum -= d.buf.shift()[1];
      d.noise = Math.sqrt(Math.max(0, d.sum) / d.buf.length);
    };
    hub.on(diag.onS);
    diag.timer = setInterval(renderDiag, 200);
  } catch (e) {
    errors.diag = toAppError(e);
    diag = null;
    renderMessages();
  }
  renderDiag();
}
function stopDiag() {
  if (!diag) return;
  if (diag.onS) hub.off(diag.onS);
  clearInterval(diag.timer);
  diag = null;
  if (!busy) hub.stop();
  renderDiag();
}
async function testVibration() {
  if (busy || (diag && diag.vibBusy)) return;
  errors.diag = null; renderMessages();
  const blocker = capabilityBlocker();
  if (blocker) { errors.diag = blocker; renderMessages(); return; }
  if (excitationKind() === 'taps') hapticTap();   // immediate tap you can feel: confirms iOS haptics work at all
  const autoStarted = !diag;
  if (!diag) { await startDiag(); if (!diag || diag.starting) return; }
  diag.vibBusy = true; diagVib = null; renderDiag();
  try {
    await wait(400);
    const rec = await record({ baselineMs: 600, durMs: 1000, postMs: 300 });
    const r = analyzeRun(rec);
    diagVib = { rms: r.rms, base: r.base, ok: r.rms >= Math.max(CFG.vibAbsMin, CFG.vibRatioMin * r.base), fs: r.fs, taps: excitationKind() === 'taps' };
  } catch (e) {
    errors.diag = toAppError(e);
  } finally {
    if (diag) diag.vibBusy = false;
    if (autoStarted) stopDiag();
    renderDiag(); renderMessages();
  }
}

/* ---------- canvas drawing ---------- */
function prep(c) {
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return null;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const W = Math.round(w * dpr), H = Math.round(h * dpr);
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.direction = 'ltr';
  return { ctx, W: w, H: h };
}
function placeholder(ctx, W, H, text) {
  ctx.fillStyle = '#5b6574'; ctx.font = '14px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, H / 2);
}
function envelope(pts, win) {
  const out = []; let sum = 0, j = 0;
  for (let i = 0; i < pts.length; i++) {
    sum += pts[i][1] * pts[i][1];
    while (pts[j][0] < pts[i][0] - win) { sum -= pts[j][1] * pts[j][1]; j++; }
    out.push([pts[i][0], Math.sqrt(Math.max(0, sum) / (i - j + 1))]);
  }
  return out;
}
function drawTrace(canvas, trs, activeIdx) {
  const g = prep(canvas); if (!g) return;
  const { ctx, W, H } = g;
  if (!trs.length || !trs.some(tr => tr.pts.length > 1)) { placeholder(ctx, W, H, tp('graphEmpty')); return; }
  const padL = 8, padR = 8, padT = 24, padB = 8, pw = W - padL - padR, ph = H - padT - padB;
  const ref = trs[activeIdx >= 0 && activeIdx < trs.length ? activeIdx : trs.length - 1];
  const total = ref.total || 1;
  let yMax = 0.15;
  for (const tr of trs) for (const p of tr.pts) if (p[0] > 150 && p[1] > yMax) yMax = p[1];
  yMax *= 1.08;
  const X = tm => padL + clamp(tm / total, 0, 1) * pw;
  const Y = v => padT + ph - clamp(v / yMax, 0, 1) * ph;
  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) { const y = Math.round(padT + ph * k / 4) + 0.5; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke(); }
  if (ref.tVib) {
    const v0 = ref.tVib - ref.tStart;
    ctx.fillStyle = 'rgba(47,209,176,.07)'; ctx.fillRect(X(v0), padT, X(v0 + ref.durMs) - X(v0), ph);
    ctx.fillStyle = 'rgba(47,209,176,.14)'; ctx.fillRect(X(v0 + CFG.trimMs), padT, X(v0 + ref.durMs - CFG.trimMs) - X(v0 + CFG.trimMs), ph);
  }
  const line = (pts, color, width, alpha) => {
    if (pts.length < 2) return;
    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach((p, i) => { const x = X(p[0]), y = Y(p[1]); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.stroke();
    ctx.globalAlpha = 1;
  };
  const focus = activeIdx >= 0 ? activeIdx : -1;
  trs.forEach((tr, i) => {
    const isFocus = focus < 0 || i === focus;
    if (i === (focus >= 0 ? focus : trs.length - 1)) line(tr.pts, '#e9edf3', 1, 0.28);
    line(envelope(tr.pts, 150), RUN_COLORS[i % RUN_COLORS.length], isFocus ? 2.4 : 1.6, isFocus ? 1 : 0.45);
    if (tr.rms != null && tr.tVib) {
      const v0 = tr.tVib - tr.tStart;
      ctx.setLineDash([5, 4]); ctx.strokeStyle = RUN_COLORS[i % RUN_COLORS.length]; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.moveTo(X(v0 + CFG.trimMs), Y(tr.rms)); ctx.lineTo(X(v0 + tr.durMs - CFG.trimMs), Y(tr.rms)); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
  });
  ctx.font = '12px system-ui, sans-serif'; ctx.textBaseline = 'top'; ctx.fillStyle = '#98a2b3';
  ctx.textAlign = 'left'; ctx.fillText(`${fmtA(yMax)} m/s²`, padL + 2, 5);
  const li = focus >= 0 ? focus : trs.length - 1, lt = trs[li];
  let label = tp('runLabel', { i: li + 1, n: CFG.repeats });
  if (lt && lt.rms != null) label += `  ·  RMS ${fmtA(lt.rms)}`;
  ctx.textAlign = 'right'; ctx.direction = lang === 'ar' ? 'rtl' : 'ltr'; ctx.fillStyle = RUN_COLORS[li % RUN_COLORS.length]; ctx.fillText(label, W - padR - 2, 5); ctx.direction = 'ltr';
}

function niceTicks(max, count) {
  if (!(max > 0)) max = 1;
  const raw = max / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
  const step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 5 ? 5 : 10) * mag;
  const top = Math.ceil(max / step - 1e-9) * step, ticks = [];
  for (let v = 0; v <= top + step * 1e-6; v += step) ticks.push(+v.toPrecision(10));
  return { ticks, max: top };
}
const fmtTick = v => v === 0 ? '0' : Math.abs(v) >= 1 ? String(+v.toFixed(2)) : String(+v.toPrecision(2));

function drawFit() {
  const g = prep($('fitCanvas')); if (!g) return;
  const { ctx, W, H } = g, pts = cal.points, fit = currentFit;
  if (!pts.length) { placeholder(ctx, W, H, tp('fitEmpty')); return; }
  const padL = 44, padR = 14, padT = 22, padB = 26, pw = W - padL - padR, ph = H - padT - padB;
  const xT = niceTicks(Math.max(1, ...pts.map(p => p.w)) * 1.05, 4);
  const est = lastResult && lastResult.est && lastResult.est.w != null ? lastResult : null;
  const yT = niceTicks(Math.max(...pts.map(p => p.mean + (p.sd || 0)), est ? est.mean : 0) * 1.1, 4);
  const X = w => padL + clamp(w / xT.max, -0.02, 1.02) * pw, Y = a => padT + ph - (a / yT.max) * ph;
  ctx.font = '11px system-ui, sans-serif'; ctx.fillStyle = '#98a2b3'; ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (const v of yT.ticks) { const y = Math.round(Y(v)) + 0.5; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke(); ctx.fillText(fmtTick(v), padL - 6, y); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const v of xT.ticks) ctx.fillText(fmtTick(v), X(v), padT + ph + 6);
  ctx.textAlign = 'left'; ctx.fillText('m/s²', 4, 4);
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText(tp('unitG'), W - padR, padT + ph - 4);
  if (fit && fit.ok) {
    const M = MODELS[fit.model];
    const seg = (a, b, dashed) => {
      ctx.setLineDash(dashed ? [4, 4] : []); ctx.strokeStyle = '#2fd1b0'; ctx.lineWidth = dashed ? 1.4 : 2.2; ctx.globalAlpha = dashed ? 0.6 : 1;
      ctx.beginPath(); let started = false;
      for (let i = 0; i <= 120; i++) {
        const x = a + (b - a) * i / 120, y = M.f(x, fit.p);
        if (!isFinite(y) || y < -yT.max || y > yT.max * 2) { started = false; continue; }
        const px = X(x), py = clamp(Y(y), padT - 4, padT + ph + 4);
        if (started) ctx.lineTo(px, py); else { ctx.moveTo(px, py); started = true; }
      }
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    };
    if (fit.wMin > 0) seg(0, fit.wMin, true);
    seg(fit.wMin, fit.wMax, false);
    seg(fit.wMax, xT.max, true);
  }
  for (const p of pts) {
    const x = X(p.w);
    if (p.sd > 0) { ctx.strokeStyle = 'rgba(233,237,243,.55)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, Y(p.mean - p.sd)); ctx.lineTo(x, Y(p.mean + p.sd)); ctx.stroke(); }
    ctx.fillStyle = '#e9edf3'; ctx.strokeStyle = '#0d1014'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, Y(p.mean), 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  if (est) {
    const x = X(Math.max(0, est.est.w)), y = Y(est.mean);
    ctx.fillStyle = '#f3b33d'; ctx.strokeStyle = '#0d1014'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.lineTo(x + 7, y); ctx.lineTo(x, y + 7); ctx.lineTo(x - 7, y); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function activeIdx(area) { return busy && busy.mode === area ? busy.runIdx : -1; }
function drawAll() {
  drawTrace($('measCanvas'), traces.measure, activeIdx('measure'));
  drawTrace($('calCanvas'), traces.cal, activeIdx('cal'));
  drawFit();
}

let rafId = 0;
function loop() {
  rafId = 0;
  if (!busy) return;
  const area = busy.mode;
  drawTrace($(area === 'measure' ? 'measCanvas' : 'calCanvas'), traces[area], busy.runIdx);
  if (busy.phase === 'run' || busy.phase === 'pause') {
    const tr = traces[area][busy.runIdx];
    const frac = busy.phase === 'pause' ? 1 : (tr && tr.total ? clamp((performance.now() - tr.tStart) / tr.total, 0, 1) : 0);
    setBar(area, (busy.runIdx + frac) / CFG.repeats);
  }
  rafId = requestAnimationFrame(loop);
}
function kick() { if (!rafId) rafId = requestAnimationFrame(loop); }

function renderAll() {
  applyStatic();
  renderBanners();
  renderChip();
  renderSettings();
  renderMessages();
  renderResult();
  renderCal();
  setBusyUI();
  requestAnimationFrame(drawAll);
}

function showTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  window.scrollTo(0, 0);
  requestAnimationFrame(drawAll);
}

/* =====================================================================
   Import / export
   ===================================================================== */
function exportCal() {
  const data = JSON.stringify({ app: 'VibroScale', exported: new Date().toISOString(), settings, version: cal.version, points: cal.points }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
  a.download = `vibroscale-calibration-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function importCal(file) {
  const fr = new FileReader();
  fr.onload = () => {
    errors.cal = null; calNote = null;
    try {
      const c = sanitizeCal(JSON.parse(fr.result));
      if (!c || !c.points.length) throw new Error('empty');
      if (cal.points.length && !confirm(tp('importConfirm'))) return;
      cal = c; saveCal(); refit();
      calNote = { kind: 'ok', k: 'importOk' };
      renderCal(); renderChip();
    } catch (_) { errors.cal = E('importBad'); }
    renderMessages();
  };
  fr.readAsText(file);
}

/* =====================================================================
   Wiring
   ===================================================================== */
async function watchPermission() {
  if (!navigator.permissions || !navigator.permissions.query) return;
  try {
    const st = await navigator.permissions.query({ name: 'accelerometer' });
    const upd = () => { permState = ['granted', 'denied', 'prompt'].includes(st.state) ? st.state : 'unknown'; computeBanners(); renderBanners(); renderDiag(); };
    st.onchange = upd; upd();
  } catch (_) { /* not supported */ }
}

function init() {
  refit();
  computeBanners();
  renderAll();
  setStatus('measure', 'stIdle');
  setStatus('cal', 'stIdleCal');

  $('langBtn').addEventListener('click', () => { lang = lang === 'ar' ? 'en' : 'ar'; store.set(KEYS.lang, lang); renderAll(); });
  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  $('calChip').addEventListener('click', () => showTab('cal'));
  $('measureBtn').addEventListener('click', () => { if (busy) { if (busy.mode === 'measure') cancelSession(); } else startSession('measure'); });
  $('calMeasureBtn').addEventListener('click', () => { if (busy) { if (busy.mode === 'cal') cancelSession(); } else startSession('cal'); });
  $('calWeight').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!busy) startSession('cal'); } });
  $('calZero').addEventListener('click', () => { $('calWeight').value = '0'; });
  $('resetBtn').addEventListener('click', () => {
    if (busy || !cal.points.length || !confirm(tp('resetConfirm'))) return;
    cal = { version: 1, points: [] }; saveCal(); refit();
    errors.cal = null; calNote = { kind: 'ok', k: 'resetDone' };
    renderCal(); renderChip(); renderMessages();
  });
  $('exportBtn').addEventListener('click', exportCal);
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importCal(f); e.target.value = ''; });
  $('setSound').addEventListener('change', e => { settings.sound = e.target.checked; saveSettings(); if (settings.sound) unlockAudio(); });
  $('diagBtn').addEventListener('click', () => { if (diag) stopDiag(); else startDiag(); });
  $('diagVibBtn').addEventListener('click', testVibration);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    if (busy) busy.ctrl.abort(E('hidden'));
    stopDiag();
  });
  let resizeRaf = 0;
  window.addEventListener('resize', () => { if (!resizeRaf) resizeRaf = requestAnimationFrame(() => { resizeRaf = 0; drawAll(); }); });
  watchPermission();
}

// Exposed for debugging from the console / automated tests.
window.VibroScale = { CFG, MODELS, fitCalibration, estimateWeight, analyzeRun, parseWeight, get calibration() { return cal; }, get fit() { return currentFit; }, get lastResult() { return lastResult; } };

init();
})();
</script>
